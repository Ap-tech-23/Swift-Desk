<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swift Desk • Notes</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .actions{display:flex;gap:8px}
    .actions button{flex:1}
    .note{background:#1E293B;padding:14px;border-radius:16px;margin-top:12px}
    .top{display:flex;justify-content:space-between;align-items:center}
    .pin{cursor:pointer;font-size:20px}
    .empty{text-align:center;color:#94A3B8;padding:30px}
  </style>
</head>
<body>

<div class="hero">
  <p>📚 Swift Desk</p>
  <h1>My Notes</h1>
  <p>Organize your study notes</p>
</div>

<div class="menu">

  <div class="big-card">
    <h3>Search</h3>
    <input id="search" placeholder="Search notes...">
  </div>

  <div class="big-card">
    <h3>New Note</h3>
    <input id="title" placeholder="Note title">
    <textarea id="content" placeholder="Write your notes here..."></textarea>

    <div class="actions">
      <button id="save">Save</button>
      <button id="clear">Clear</button>
    </div>
  </div>

  <div id="list"></div>

</div>

<div class="nav">
  <a href="dashboard.html">🏠</a>
  <a href="notes.html">📚</a>
  <a href="quiz.html">📝</a>
  <a href="ai.html">🤖</a>
  <a href="profile.html">👤</a>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("swift_notes") || "[]");

const title = document.getElementById("title");
const content = document.getElementById("content");
const list = document.getElementById("list");
const search = document.getElementById("search");

function saveStorage(){
  localStorage.setItem("swift_notes", JSON.stringify(notes));
}

function render(){
  list.innerHTML="";
  let key = search.value.toLowerCase();

  let data = notes.filter(n =>
    n.title.toLowerCase().includes(key) ||
    n.content.toLowerCase().includes(key)
  );

  data.sort((a,b)=>b.pin-a.pin);

  if(data.length===0){
    list.innerHTML='<div class="empty">No notes found</div>';
    return;
  }

  data.forEach((n)=>{
    const card=document.createElement("div");
    card.className="note";
    card.innerHTML=`
      <div class="top">
        <h3>${n.title}</h3>
        <span class="pin">${n.pin?"⭐":"☆"}</span>
      </div>
      <p>${n.content}</p>
      <button>Delete</button>
    `;

    card.querySelector(".pin").onclick=()=>{
      n.pin=!n.pin;
      saveStorage();
      render();
    };

    card.querySelector("button").onclick=()=>{
      notes=notes.filter(x=>x.id!==n.id);
      saveStorage();
      render();
    };

    list.appendChild(card);
  });
}

document.getElementById("save").onclick=()=>{
  if(title.value===""||content.value==="") return;

  notes.unshift({
    id:Date.now(),
    title:title.value,
    content:content.value,
    pin:false
  });

  saveStorage();
  title.value="";
  content.value="";
  render();
};

document.getElementById("clear").onclick=()=>{
  title.value="";
  content.value="";
};

search.oninput=render;

render();
</script>

</body>
</html>
