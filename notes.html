
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swift Desk • Notes</title>
<link rel="stylesheet" href="style.css">
<style>
.note{background:#1E293B;padding:16px;border-radius:16px;margin:10px 0;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;padding:20px}
.box{background:#1E293B;width:100%;max-width:500px;border-radius:18px;padding:18px}
.preview{color:#CBD5E1}
</style>
</head>
<body>

<div class="hero">
  <p>📚 Swift Desk</p>
  <h1>My Notes</h1>
  <p>Create & manage notes</p>
</div>

<div class="menu">

  <div class="big-card">
    <input id="title" placeholder="Note title">
    <textarea id="content" placeholder="Write full note..."></textarea>
    <button id="save">Save Note</button>
  </div>

  <div class="big-card">
    <input id="search" placeholder="Search notes...">
  </div>

  <div id="list"></div>

</div>

<div class="modal" id="modal">
  <div class="box">
    <h2 id="viewTitle"></h2>
    <p id="viewContent"></p>
    <br>
    <button onclick="closeNote()">Close</button>
  </div>
</div>

<div class="nav">
  <a href="dashboard.html">🏠</a>
  <a href="notes.html">📚</a>
  <a href="quiz.html">📝</a>
  <a href="ai.html">🤖</a>
  <a href="profile.html">👤</a>
</div>

<script>
let notes=JSON.parse(localStorage.getItem("swift_notes")||"[]");

function saveDB(){
 localStorage.setItem("swift_notes",JSON.stringify(notes));
}

function render(){
 const key=search.value.toLowerCase();
 list.innerHTML="";

 notes.filter(n=>n.title.toLowerCase().includes(key)||n.content.toLowerCase().includes(key))
 .forEach(n=>{
   const d=document.createElement("div");
   d.className="note";
   d.innerHTML=`
    <div class="top">
      <h3>${n.title}</h3>
      <button onclick="del(${n.id});event.stopPropagation()">🗑</button>
    </div>
    <p class="preview">${n.content.substring(0,80)}...</p>`;
   d.onclick=()=>openNote(n);
   list.appendChild(d);
 });
}

function openNote(n){
 modal.style.display="flex";
 viewTitle.innerText=n.title;
 viewContent.innerText=n.content;
}

function closeNote(){
 modal.style.display="none";
}

function del(id){
 notes=notes.filter(x=>x.id!==id);
 saveDB();
 render();
}

save.onclick=()=>{
 if(title.value===""||content.value==="") return;

 notes.unshift({
   id:Date.now(),
   title:title.value,
   content:content.value
 });

 saveDB();
 title.value="";
 content.value="";
 render();
};

search.oninput=render;
render();
</script>

</body>
</html>
