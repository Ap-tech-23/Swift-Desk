<html>
<head>
  <title>Sophia AI</title>
  <link rel="stylesheet" href="style.css">

<body>

<div class="hero">
  <p>🤖 Sophia</p>
  <h1>AI Study Assistant</h1>
  <p>Ask doubts, summaries & explanations</p>
</div>

<div class="chat-box" id="chat">

  <div class="ai-msg">
    <b>Sophia</b>
    <p>Hi! I'm Sophia. What would you like to learn today?</p>

</div>

  <button class="chip">Explain a topic</button>
  <button class="chip">Generate MCQs</button>
  <button class="chip">Summarize notes</button>
</div>

<div class="input-area">
  <textarea id="prompt" placeholder="Ask Sophia anything..."></textarea>
  <button id="askAI">Send</button>
</div>
