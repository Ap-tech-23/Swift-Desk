<!DOCTYPE html>
<html>
<head>
  <title>Swift Desk • Sophia AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chat{padding:16px;display:flex;flex-direction:column;gap:12px;height:55vh;overflow:auto}
    .ai,.you{max-width:85%;padding:12px 14px;border-radius:16px}
    .ai{background:#1E293B;align-self:flex-start}
    .you{background:#2563EB;align-self:flex-end}
    .chips{display:flex;overflow:auto;gap:8px;padding:0 16px 12px}
    .chip{background:#1E293B;border:none;color:#fff;padding:8px 12px;border-radius:20px;white-space:nowrap}
    .input{position:fixed;bottom:72px;left:0;right:0;padding:12px;background:#0F172A}
    .row{display:flex;gap:8px}
    .row textarea{flex:1;height:52px}
    .row button{width:70px}
  </style>
</head>
<body>

<div class="hero">
  <p>🤖 Sophia</p>
  <h1>AI Study Assistant</h1>
  <p>Ask doubts, summaries & explanations</p>
</div>

<div id="chat" class="chat">
  <div class="ai">
    <b>Sophia</b>
    <p>Hi! I'm Sophia 🌸. Ask me any study question.</p>
  </div>
</div>

<div class="chips">
  <button class="chip" onclick="fill('Explain Photosynthesis')">Explain</button>
  <button class="chip" onclick="fill('Generate 10 MCQs on History')">10 MCQs</button>
  <button class="chip" onclick="fill('Summarize Chapter 1')">Summary</button>
  <button class="chip" onclick="fill('Translate to Marathi')">Translate</button>
</div>

<div class="input">
  <div class="row">
    <textarea id="msg" placeholder="Ask Sophia anything..."></textarea>
    <button onclick="send()">Send</button>
  </div>
</div>

<div class="nav">
  <a href="dashboard.html">🏠</a>
  <a href="notes.html">📚</a>
  <a href="quiz.html">📝</a>
  <a href="ai.html">🤖</a>
  <a href="profile.html">👤</a>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("msg");

function fill(t){input.value=t;input.focus();}

function add(text,type){
  const d=document.createElement("div");
  d.className=type;
  d.innerHTML=`<b>${type==="ai"?"Sophia":"You"}</b><p>${text}</p>`;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function answer(q){
  q=q.toLowerCase();

  if(q.includes("photosynthesis"))
    return "Photosynthesis is the process by which green plants prepare food using sunlight, water and carbon dioxide.";

  if(q.includes("newton"))
    return "Newton's First Law: An object remains at rest or in uniform motion unless acted upon by an external force.";

  if(q.includes("history"))
    return "Study history by learning events in chronological order and connecting causes with consequences.";

  if(q.includes("summary"))
    return "A good chapter summary contains key ideas, important terms, formulas and a 5-point revision note.";

  if(q.includes("marathi"))
    return "मी मराठीतही अभ्यास समजावून सांगू शकते. तुमचा प्रश्न पाठवा.";

  if(q.includes("mcq"))
    return "Go to the Quiz page to generate MCQ tests. Sophia Quiz supports timer and scoring.";

  return "I'm Sophia 🌸. I can explain science, maths, history, English and generate study guidance. Ask me any topic!";
}

function send(){
  const q=input.value.trim();
  if(!q) return;

  add(q,"you");
  input.value="";

  setTimeout(()=>{
    add(answer(q),"ai");
  },600);
}
</script>

</body>
</html>
