<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swift Desk • Sophia Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <p>📝 Sophia AI</p>
  <h1>Generate Any Quiz</h1>
  <p>MCQ • Written • Mixed</p>
</div>

<div class="menu" id="setup">

  <div class="big-card">
    <h3>Topic</h3>
    <input id="topic" placeholder="Photosynthesis / Java / History">
  </div>

  <div class="big-card">
    <h3>Quiz Type</h3>
    <select id="type">
      <option>MCQ</option>
      <option>Written</option>
      <option>Mixed</option>
    </select>
  </div>

  <div class="big-card">
    <h3>Difficulty</h3>
    <select id="difficulty">
      <option>Easy</option>
      <option>Medium</option>
      <option>Hard</option>
    </select>
  </div>

  <div class="big-card">
    <h3>Questions</h3>
    <select id="count">
      <option>5</option>
      <option>10</option>
      <option>15</option>
    </select>
  </div>

  <div class="big-card">
    <h3>Timer</h3>
    <select id="timerSelect">
      <option value="300">5 Minutes</option>
      <option value="600">10 Minutes</option>
      <option value="1200">20 Minutes</option>
    </select>
  </div>

  <button id="generate">Generate with Sophia</button>

</div>

<div class="menu" id="quiz" style="display:none">

  <div class="big-card">
    <h3 id="timer">05:00</h3>
    <p id="progress"></p>
    <h2 id="question"></h2>
  </div>

  <button class="option" id="o0"></button>
  <button class="option" id="o1"></button>
  <button class="option" id="o2"></button>
  <button class="option" id="o3"></button>

  <button id="next">Next</button>

</div>

<div class="menu" id="result" style="display:none">

  <div class="big-card">
    <h1>🎉 Finished</h1>
    <h2 id="score"></h2>
    <p id="review"></p>
  </div>

  <button onclick="location.reload()">New Quiz</button>

</div>

<div class="nav">
  <a href="dashboard.html">🏠</a>
  <a href="notes.html">📚</a>
  <a href="quiz.html">📝</a>
  <a href="ai.html">🤖</a>
  <a href="profile.html">👤</a>
</div>

<script>
const BACKEND_URL = "YOUR_FIREBASE_FUNCTION_URL";

let quiz=[], current=0, marks=0, selected=-1;
let seconds=300, interval;

document.getElementById("generate").onclick = async ()=>{
  const topic = topicInput.value.trim();
  if(!topic){ alert("Enter a topic"); return; }

  generate.innerText="Generating...";
  generate.disabled=true;

  try{
    const res = await fetch(BACKEND_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        task:"quiz",
        topic,
        type:type.value,
        difficulty:difficulty.value,
        count:Number(count.value)
      })
    });

    const data = await res.json();
    quiz = data.questions;

    setup.style.display="none";
    quizPage.style.display="flex";

    seconds = Number(timerSelect.value);
    loadQuestion();
    startTimer();

  }catch(e){
    alert("Sophia is offline. Connect Firebase backend.");
  }

  generate.innerText="Generate with Sophia";
  generate.disabled=false;
};

const topicInput=document.getElementById("topic");
const type=document.getElementById("type");
const difficulty=document.getElementById("difficulty");
const count=document.getElementById("count");
const timerSelect=document.getElementById("timerSelect");
const setup=document.getElementById("setup");
const quizPage=document.getElementById("quiz");

function loadQuestion(){
  const q=quiz[current];
  progress.innerText=`Question ${current+1} / ${quiz.length}`;
  question.innerText=q.question;

  q.options.forEach((t,i)=>{
    const b=document.getElementById("o"+i);
    b.innerText=t;
    b.style.background="#2563EB";
    b.onclick=()=>select(i);
  });

  selected=-1;
}

function select(i){
  selected=i;
  for(let x=0;x<4;x++)
    document.getElementById("o"+x).style.background="#2563EB";
  document.getElementById("o"+i).style.background="#16A34A";
}

next.onclick=()=>{
  if(selected===quiz[current].answer) marks++;

  current++;

  if(current<quiz.length){
    loadQuestion();
  }else{
    finish();
  }
};

function startTimer(){
  interval=setInterval(()=>{
    seconds--;

    let m=String(Math.floor(seconds/60)).padStart(2,"0");
    let s=String(seconds%60).padStart(2,"0");

    timer.innerText=`${m}:${s}`;

    if(seconds<=0){
      finish();
    }
  },1000);
}

function finish(){
  clearInterval(interval);

  quizPage.style.display="none";
  result.style.display="flex";

  score.innerText=`${marks} / ${quiz.length}`;

  if(marks===quiz.length)
    review.innerText="Outstanding! Sophia says you're exam ready.";
  else if(marks>=quiz.length*0.6)
    review.innerText="Great job! Revise weak topics once.";
  else
    review.innerText="Keep practicing. Sophia recommends another quiz.";
}
</script>

</body>
</html>
