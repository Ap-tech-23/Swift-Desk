<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swift Desk • Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <p>👋 Welcome Back</p>
  <h1 id="username">Student</h1>
  <p>Powered by Sophia AI</p>
</div>

<div class="stats">
  <div class="stat">
    <h2 id="streak">0</h2>
    <p>Study Streak</p>
  </div>

  <div class="stat">
    <h2 id="noteCount">0</h2>
    <p>My Notes</p>
  </div>
</div>

<div class="menu">

  <div class="big-card">
    <h3>🔍 Search</h3>
    <input id="search" placeholder="Search feature coming soon">
  </div>

  <a class="big-card" href="notes.html">
    <h3>📚 My Notes</h3>
    <p>Create, search & manage notes</p>
  </a>

  <a class="big-card" href="quiz.html">
    <h3>📝 AI Quiz</h3>
    <p>Generate quizzes with Sophia</p>
  </a>

  <a class="big-card" href="ai.html">
    <h3>🤖 Sophia AI</h3>
    <p>Ask doubts & explanations</p>
  </a>

  <a class="big-card" href="profile.html">
    <h3>👤 Profile</h3>
    <p>Class, Board & Progress</p>
  </a>

  <a class="big-card" href="premium.html">
    <h3>👑 Premium</h3>
    <p>Coming Soon</p>
  </a>

</div>

<div class="nav">
  <a href="dashboard.html">🏠</a>
  <a href="notes.html">📚</a>
  <a href="quiz.html">📝</a>
  <a href="ai.html">🤖</a>
  <a href="profile.html">👤</a>
</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="app.js"></script>

<script>
const notes = JSON.parse(localStorage.getItem("swift_notes") || "[]");
document.getElementById("noteCount").textContent = notes.length;

// Simple study streak
const today = new Date().toDateString();
const last = localStorage.getItem("lastOpen");
let streak = Number(localStorage.getItem("streak") || 0);

if (last !== today) {
  streak++;
  localStorage.setItem("streak", streak);
  localStorage.setItem("lastOpen", today);
}
document.getElementById("streak").textContent = streak;
</script>

</body>
</html>
