<!DOCTYPE html>
<html>
<head>
  <title>Swift Desk - Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="profile-card">

  <div class="avatar">👤</div>

  <h2 id="name">Student</h2>
  <p id="email">student@email.com</p>

  <div class="info">

    <label>Class</label>
    <select id="class">
      <option>6</option>
      <option>7</option>
      <option>8</option>
      <option>9</option>
      <option>10</option>
      <option>11</option>
      <option>12</option>
      <option selected>Diploma</option>
      <option>College</option>
    </select>

    <label>Board</label>
    <select id="board">
      <option>SSC</option>
      <option>CBSE</option>
      <option>HSC</option>
      <option selected>MSBTE</option>
      <option>Other</option>
    </select>

    <button id="saveProfile">Save Profile</button>

    <button id="logout">Logout</button>

  </div>

</div>

</div>

</body>
</html>
