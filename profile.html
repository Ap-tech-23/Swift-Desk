<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swift Desk • Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <p>👤 My Profile</p>
  <h1 id="name">Student</h1>
  <p id="email">student@email.com</p>
</div>

<div class="menu">

  <div class="big-card">
    <h3>Class</h3>
    <select id="class">
      <option>10</option>
      <option>11</option>
      <option>12</option>
      <option selected>Diploma</option>
      <option>College</option>
    </select>
  </div>

  <div class="big-card">
    <h3>Board</h3>
    <select id="board">
      <option>SSC</option>
      <option>CBSE</option>
      <option>HSC</option>
      <option selected>MSBTE</option>
    </select>
  </div>

  <button id="saveProfile">Save Profile</button>
  <button id="logout">Logout</button>

</div>

  <a href="dashboard.html">🏠</a>
